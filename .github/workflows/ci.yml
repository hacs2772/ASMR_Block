# GitHub에 push하면 자동으로 백엔드 테스트 + 웹 빌드를 확인합니다.
# 결과는 GitHub 저장소의 Actions 탭에서 볼 수 있어요 (초록 체크 = 통과).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asmr-block/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트 실행 (Testcontainers가 PostgreSQL을 자동으로 띄움)
        run: ./gradlew test --no-daemon
      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: asmr-block/backend/build/reports/tests/test

  web:
    name: 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asmr-block/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asmr-block/frontend/package-lock.json
      - run: npm ci
      - name: 빌드
        run: npm run build
        env:
          CI: false   # 경고(warning)는 실패로 치지 않음
