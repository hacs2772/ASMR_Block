# GitHub에 push하면 자동으로 백엔드 테스트 + 앱 검사 + 웹 빌드 + 화면 검사(웹·앱을 직접 눌러 봄)를 확인합니다.
# 결과는 GitHub 저장소의 Actions 탭에서 볼 수 있어요 (초록 체크 = 통과).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asmr-block/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: ffmpeg 설치 (음원 변환/완성본 테스트용)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: 테스트 실행 (Testcontainers가 PostgreSQL을 자동으로 띄움)
        run: ./gradlew test --no-daemon
      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: asmr-block/backend/build/reports/tests/test

  mobile:
    name: 모바일 앱 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asmr-block/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asmr-block/mobile/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 코드 규칙 검사
        run: npx eslint .
      - name: 단위 테스트
        run: npx jest --ci
      - name: Expo 호환성 검사
        run: npx expo-doctor
      - name: 안드로이드/iOS 번들 만들기
        run: npx expo export --platform android --platform ios --output-dir /tmp/mobile-export

  e2e:
    name: 화면 검사 (웹·앱을 직접 눌러 봄)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: 서버·DB·웹 켜기 (개발용 docker compose, 샘플 음원·테스트 계정 포함)
        working-directory: asmr-block
        run: docker compose up -d --build
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            asmr-block/mobile/package-lock.json
            asmr-block/e2e/package-lock.json
      - name: 앱 웹 미리보기 만들고 띄우기 (:8081)
        working-directory: asmr-block/mobile
        run: |
          npm ci
          npx expo export -p web --output-dir /tmp/app-web
          (npx --yes serve@14.2.6 -s /tmp/app-web -l 8081 > /tmp/serve-app.log 2>&1 &)
      - name: 검사 도구 설치 (Playwright + 크롬)
        working-directory: asmr-block/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 서버가 준비될 때까지 기다리기
        run: |
          for i in $(seq 1 120); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null && curl -fs http://localhost:3000 > /dev/null && curl -fs http://localhost:8081 > /dev/null; then
              echo "준비됐어요"; exit 0
            fi
            sleep 5
          done
          echo "10분 안에 서버가 켜지지 않았어요"; exit 1
      - name: 화면 검사
        working-directory: asmr-block/e2e
        run: npx playwright test
      - name: 실패하면 서버 기록 보기
        if: failure()
        working-directory: asmr-block
        run: docker compose logs --tail 300 backend
      - name: 실패하면 검사 결과(화면·기록) 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            asmr-block/e2e/playwright-report
            asmr-block/e2e/test-results

  web:
    name: 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asmr-block/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: asmr-block/frontend/package-lock.json
      - run: npm ci
      - name: 테스트 (편집기 계산)
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - name: 빌드
        run: npm run build
        env:
          CI: false   # 경고(warning)는 실패로 치지 않음
