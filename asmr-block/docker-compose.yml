# =====================================================
# ASMR Block 개발 환경 - 이 폴더(asmr-block)에서 실행:
#
#   docker compose up --build
#
#   웹 화면      http://localhost:3000   (test@asmrblock.com / password123)
#   API 문서     http://localhost:8080/swagger-ui.html
#   DB           localhost:5432  (postgres / postgres, DB: asmrblock)
#
# 끄기: Ctrl+C 또는 docker compose down
# DB/음원까지 완전 초기화: docker compose down -v
# =====================================================
name: asmr-block

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asmrblock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asmrblock"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/asmrblock
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_STORAGE_LOCAL_DIR: /data/media
      APP_STORAGE_PUBLIC_BASE_URL: http://localhost:8080/files
      APP_GENERATE_SAMPLE_AUDIO: "true"   # 첫 실행 때 샘플 음원 12개 생성 (1~2분)
    ports:
      - "8080:8080"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
