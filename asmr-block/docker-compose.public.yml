# =====================================================
# ASMR Block 공개용 - 내 PC를 서버로 쓰고 Cloudflare Tunnel로 https://asmrblock.com 에 연결
#
#   start-public.bat 을 더블클릭 (처음이면 .env.public 을 만들어 줌)
#   또는: docker compose -f docker-compose.public.yml --env-file .env.public up -d --build --wait
#
#   - 개발용(docker-compose.yml)과 DB·파일이 따로예요. 테스트 계정(password123) 없이, 샘플 블록·조합만 넣고 시작
#   - 관리자 계정 = .env.public 의 ADMIN_EMAIL / ADMIN_PASSWORD
#   - 공유기 포트를 열지 않아요. tunnel(cloudflared)이 Cloudflare로 나가는 연결만 만듦
#   - 내 PC 확인용: http://localhost:8088 (음원 주소는 https://asmrblock.com 기준이라 소리는 터널이 켜져야 나옴)
#
# 끄기: docker compose -f docker-compose.public.yml --env-file .env.public down
# ⚠ down -v 는 공개용 DB·올린 음원까지 지워요 (되돌릴 수 없음)
# =====================================================
name: asmr-block-public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asmrblock
      POSTGRES_USER: asmrblock
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env.public 에 DB_PASSWORD 가 없어요}
    # 포트를 밖으로 열지 않음 (같은 도커 안의 backend만 접속)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmrblock -d asmrblock"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: public
      DB_URL: jdbc:postgresql://db:5432/asmrblock
      DB_USERNAME: asmrblock
      DB_PASSWORD: ${DB_PASSWORD:?.env.public 에 DB_PASSWORD 가 없어요}
      JWT_SECRET: ${JWT_SECRET:?.env.public 에 JWT_SECRET 이 없어요}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:?.env.public 에 ADMIN_EMAIL 이 없어요}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env.public 에 ADMIN_PASSWORD 가 없어요}
      APP_STORAGE_LOCAL_DIR: /data/media
      # 음원·사진 주소를 https://asmrblock.com/files/... 로 (웹이 /files 를 백엔드로 넘김)
      APP_STORAGE_PUBLIC_BASE_URL: ${PUBLIC_URL:?.env.public 에 PUBLIC_URL 이 없어요}/files
      # 웹은 같은 주소에서 부르지만, 브라우저가 Origin을 붙여 보내서 허용 목록에 넣어 둠
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL},http://localhost:8088
      APP_BETA_QUICK_LOGIN: ${BETA_QUICK_LOGIN:-true}
      # 샘플 블록 소리 파일(합성음)을 처음 켤 때 만들어 둠 (이미 있으면 건너뜀, 1~2분)
      APP_GENERATE_SAMPLE_AUDIO: "true"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      # 처음 켤 때 샘플 소리 만들기(1~2분) + DB 정리까지 넉넉히 (start-public.bat이 준비될 때까지 기다림)
      start_period: 600s

  web:
    build:
      context: ./frontend
      args:
        # 같은 주소의 /api 로 부름 (https://asmrblock.com/api/v1)
        REACT_APP_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"   # 내 PC에서만 확인용
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare 대시보드 > Zero Trust > Networks > Tunnels 에서 만든 터널의 토큰
      # 터널의 Public Hostname: asmrblock.com, www.asmrblock.com → http://web:80
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?.env.public 에 TUNNEL_TOKEN 이 없어요}
    depends_on:
      - web

volumes:
  pgdata:
  media:
