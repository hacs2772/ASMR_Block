# =====================================================
# 공통 설정 (모든 환경)
# 환경마다 다른 값은 환경변수로 덮어씁니다. 예) DB_URL, JWT_SECRET
# 개발용 값은 application-dev.yml 에 있습니다.
# =====================================================
spring:
  application:
    name: asmr-block

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asmrblock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # DB 테이블은 Flyway가 db/migration 폴더의 SQL로 자동 생성/변경
  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

app:
  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 32자 이상 랜덤 문자열을 넣으세요.
    # 비어 있으면 서버가 시작되지 않습니다 (실수로 기본키를 쓰는 사고 방지).
    secret: ${JWT_SECRET:}
    access-token-validity: 30m
  auth:
    refresh-token-validity: 14d
  storage:
    # 음원 파일 저장 위치 (나중에 S3/R2로 교체 예정)
    local-dir: ${APP_STORAGE_LOCAL_DIR:./media}
    # 비워두면 요청이 들어온 주소 기준 (예: 휴대폰이 192.168.0.10:8080으로 접속하면 그 주소로)
    # 운영에서는 CDN 주소를 넣음 (예: https://cdn.asmrblock.com)
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  play-count:
    # 같은 사람이 이 시간 안에 다시 재생하면 재생수를 올리지 않음
    dedupe-window: 30m
  audio:
    ffmpeg-path: ${APP_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${APP_FFPROBE_PATH:ffprobe}
    # 모든 블록을 이 음량으로 맞춤 (LUFS, 클수록 큰 소리. ASMR은 조용한 편이 좋음)
    target-lufs: -24
    process-timeout: 15m
  render:
    # 동시에 몇 개까지 완성본을 만들지 (서버 CPU에 맞게)
    max-concurrent: 2
    # 블록 사이를 겹쳐서 부드럽게 넘어가는 시간(초)
    crossfade-seconds: 1.5
    # 완성본 맨 앞/뒤 페이드 시간(초)
    fade-seconds: 3

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8080

logging:
  level:
    com.asmrblock: INFO
