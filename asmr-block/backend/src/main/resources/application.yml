# =====================================================
# 공통 설정 (모든 환경)
# 환경마다 다른 값은 환경변수로 덮어씁니다. 예) DB_URL, JWT_SECRET
# 개발용 값은 application-dev.yml 에 있습니다.
# =====================================================
spring:
  application:
    name: asmr-block

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asmrblock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # DB 테이블은 Flyway가 db/migration 폴더의 SQL로 자동 생성/변경
  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      # 영상 블록(최대 200MB) + 겉면 사진까지 한 번에
      max-file-size: 210MB
      max-request-size: 260MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

app:
  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 32자 이상 랜덤 문자열을 넣으세요.
    # 비어 있으면 서버가 시작되지 않습니다 (실수로 기본키를 쓰는 사고 방지).
    secret: ${JWT_SECRET:}
    access-token-validity: 30m
  auth:
    refresh-token-validity: 14d
  storage:
    # 파일을 어디에 둘까: local = 이 PC 디스크(local-dir) / s3 = 클라우드(Cloudflare R2 같은 S3 호환, 아래 s3.*)
    # s3로 바꾸면 local-dir에 있던 옛 파일은 켜질 때 저절로 클라우드로 옮김 (다 옮기기 전까지는 옛 파일로 재생)
    type: ${APP_STORAGE_TYPE:local}
    # 음원 파일 저장 위치 (local일 때. s3일 때는 옮기기 전 옛 파일 자리)
    local-dir: ${APP_STORAGE_LOCAL_DIR:./media}
    # 비워두면 요청이 들어온 주소 기준 (예: 휴대폰이 192.168.0.10:8080으로 접속하면 그 주소로)
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:}
    s3:
      # R2: https://<계정ID>.r2.cloudflarestorage.com (Cloudflare → R2 → API 화면에 나옴)
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      region: ${APP_STORAGE_S3_REGION:auto}
      bucket: ${APP_STORAGE_S3_BUCKET:}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:}
      # 버킷의 공개 주소 (앱·웹이 소리를 받는 곳, 예: https://files.asmrblock.com)
      public-base-url: ${APP_STORAGE_S3_PUBLIC_URL:}
      # ffmpeg가 읽을 블록 소리를 잠깐 받아 두는 곳 + 며칠 안 쓰면 지움
      cache-dir: ${APP_STORAGE_S3_CACHE_DIR:./media-cache}
      cache-keep-days: 3
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  play-count:
    # 같은 사람이 이 시간 안에 다시 재생하면 재생수를 올리지 않음
    dedupe-window: 30m
  audio:
    ffmpeg-path: ${APP_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${APP_FFPROBE_PATH:ffprobe}
    # 모든 블록을 이 음량으로 맞춤 (LUFS, 클수록 큰 소리. ASMR은 조용한 편이 좋음)
    target-lufs: -24
    process-timeout: 15m
  render:
    # 동시에 몇 개까지 완성본을 만들지 (서버 CPU에 맞게)
    max-concurrent: 2
    # 블록 사이를 겹쳐서 부드럽게 넘어가는 시간(초)
    crossfade-seconds: 1.5
    # 완성본 맨 앞/뒤 페이드 시간(초). 플레이어가 '얼마나 들을까요?' 시간만큼 반복 재생하므로
    # 이어지는 곳이 크게 끊기지 않게 짧게 (맨 처음 시작과 마지막 끝은 플레이어가 부드럽게)
    fade-seconds: 1
  shop:
    # 판매자가 올릴 때 정할 수 있는 최대 가격(코인). 너무 비싸지지 않게, 운영하면서 조절
    seller-max-price: ${APP_SHOP_SELLER_MAX_PRICE:100}
  coins:
    # 크리에이터 몫(%): 블록이 "충전 코인"으로 팔리면 그 코인의 이만큼이 크리에이터에게 (받은 코인으로 팔린 건 정산 안 됨)
    creator-share-percent: ${APP_COINS_CREATOR_SHARE_PERCENT:70}
    # 1코인 = 몇 원 (크리에이터 정산 금액 계산용)
    krw-per-coin: ${APP_COINS_KRW_PER_COIN:100}
    # 관리자가 한 번에 주거나 회수할 수 있는 최대 코인
    grant-max: 100000
  beta:
    # 베타 기간에만: "베타로 바로 시작" 버튼 (가입 없이 손님 계정을 만들어 바로 로그인)
    # ⚠ 정식 출시 때 false로 끄세요 (APP_BETA_QUICK_LOGIN=false)
    quick-login: ${APP_BETA_QUICK_LOGIN:true}
    # 손님 계정에 처음부터 담아 주는 무료 블록 수 (인기순) - 바로 조합을 만들어 볼 수 있게
    starter-blocks: 6
  admin:
    # 공개용(public)에서만 씀: 이 이메일·비밀번호로 관리자 계정을 만들거나 비밀번호를 맞춤 (.env.public)
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  limits:
    # 공개 사이트 남용 막기 (같은 접속 주소·같은 사람이 너무 자주 하면 잠깐 429). 관리자는 업로드 제한 없음
    beta-login-per-hour-per-ip: ${APP_LIMIT_BETA_LOGIN_PER_HOUR_PER_IP:20}
    beta-login-per-day: ${APP_LIMIT_BETA_LOGIN_PER_DAY:500}
    signup-per-hour-per-ip: ${APP_LIMIT_SIGNUP_PER_HOUR_PER_IP:20}
    upload-drafts-per-hour: ${APP_LIMIT_UPLOAD_DRAFTS_PER_HOUR:30}
    uploads-per-day: ${APP_LIMIT_UPLOADS_PER_DAY:20}
    # 비밀번호 마구 넣어 보기 막기: 15분 동안 같은 이메일로 10번, 같은 접속 주소에서 30번 틀리면 잠깐 막음 (맞히면 그 이메일 기록은 지움)
    login-fails-per-email: ${APP_LIMIT_LOGIN_FAILS_PER_EMAIL:10}
    login-fails-per-ip: ${APP_LIMIT_LOGIN_FAILS_PER_IP:30}
  cleanup:
    # 아무도 이만큼 안 들은 완성본(합친 MP3)은 지움 → 다시 들으면 저절로 다시 만듦 (디스크 아끼기)
    render-keep-days: ${APP_CLEANUP_RENDER_KEEP_DAYS:30}
    # 매일 새벽 4시 40분 (한국 시간)
    cron: "0 40 4 * * *"
  site:
    # 공유 링크(카톡 미리보기)에 쓰는 사이트 주소. 공개용은 PUBLIC_URL(https://asmrblock.com), 비우면 요청 주소 기준
    url: ${APP_SITE_URL:}
  upload:
    # 영상 블록 최대 크기(MB). 공개용은 Cloudflare 무료 한도(100MB) 때문에 90
    max-video-mb: ${APP_UPLOAD_MAX_VIDEO_MB:200}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8080

logging:
  level:
    com.asmrblock: INFO
