# =====================================================
# 개발 환경 설정 (SPRING_PROFILES_ACTIVE=dev)
# =====================================================
spring:
  flyway:
    # 개발 환경에서는 샘플 데이터(db/seed)도 함께 넣음
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  cors:
    # 3000: 웹(React), 8081/19006: 모바일 앱(Expo) 웹 미리보기
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

logging:
  level:
    com.asmrblock: DEBUG
