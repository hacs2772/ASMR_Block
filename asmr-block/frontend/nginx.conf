server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: /editor 같은 주소로 바로 들어와도 index.html을 보여줌
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
