server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 공개용: www.asmrblock.com → asmrblock.com (주소를 하나로)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # API·음원 파일은 같은 주소로 받아서 백엔드에 넘김 (공개용: https://asmrblock.com/api/v1)
    # 도커 안 이름(backend)을 요청 때 찾아서, 백엔드가 아직 안 켜졌어도 웹은 먼저 뜸
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;
    client_max_body_size 100m;      # Cloudflare 무료 한도(100MB)와 같게
    proxy_request_buffering off;    # 큰 영상도 바로바로 넘김
    proxy_read_timeout 300s;        # 영상 줄이기 등 오래 걸리는 업로드
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /files/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # 조합 공유 링크 (/s/12 = 카톡 미리보기 카드용 페이지, /s/12/card.png = 카드 그림) → 백엔드가 만듦
    location /s/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # React Router: /shop 같은 주소로 바로 들어와도 index.html을 보여줌
    # 보안 머리말: 다른 사이트가 우리 화면을 몰래 감싸서 누르게 하는 것 막기(frame), 파일 형식 속이기 막기(nosniff),
    # 다른 사이트로 갈 때 주소 전체를 안 넘기기(referrer), 카메라·마이크·위치는 안 씀 (/api·/files·/s는 백엔드가 붙임)
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
